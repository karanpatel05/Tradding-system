# Hosted stack: Postgres + FastAPI (serves the UI same-origin) + Caddy (TLS + Basic Auth).
# Orders go to Alpaca PAPER; Tastytrade is the market-data source.
#
# SECURITY: the backend is NOT published to the host — only Caddy is, with Basic Auth +
# TLS. There is no per-user login in the app, so this proxy auth is the only thing between
# the internet and order routing. Never expose the backend port directly.
#
# Env files (both git-ignored, both required):
#   ./.env          stack settings, read by compose for ${...} below:
#                   SITE_ADDRESS, BASIC_AUTH_USER, BASIC_AUTH_HASH, APP_SECRET_KEY,
#                   POSTGRES_PASSWORD (optional, defaults to 'trading')
#   ./backend/.env  app settings (APCA_* Alpaca keys, TT_* Tastytrade creds,
#                   APP_AUTH_TOKEN, ENABLE_LIVE_ORDERS, ...), mounted into the backend
#                   container read-write so changes saved from the API tab persist.
#
# Usage:
#   docker compose up --build
#   open https://localhost          # self-signed cert by default ('tls internal')

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: trading
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-trading}
      POSTGRES_DB: trading
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trading"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ENVIRONMENT: production
      DATABASE_URL: postgresql+asyncpg://trading:${POSTGRES_PASSWORD:-trading}@postgres:5432/trading
      APP_SECRET_KEY: ${APP_SECRET_KEY:?set APP_SECRET_KEY in .env}
    volumes:
      # The app reads its settings from /app/.env (anchored next to the app package).
      - ./backend/.env:/app/.env
    expose:
      - "8000"   # internal network only — reached via Caddy, never published to the host

  caddy:
    image: caddy:2-alpine
    depends_on:
      - backend
    ports:
      - "80:80"
      - "443:443"
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-localhost}
      BASIC_AUTH_USER: ${BASIC_AUTH_USER:?set BASIC_AUTH_USER in .env}
      BASIC_AUTH_HASH: ${BASIC_AUTH_HASH:?set BASIC_AUTH_HASH in .env (caddy hash-password)}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddydata:/data

volumes:
  pgdata:
  caddydata:
